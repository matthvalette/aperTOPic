[project]
name = "apertopic"
version = "0.1.0"
description = "Open and reusable topic-classification service for Swiss parliamentary affairs (OpenParlData.ch) using the Apertus v1.5 model family."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "aperTOPic" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "pyarrow>=17.0",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]
